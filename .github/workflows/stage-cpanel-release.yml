name: Stage cPanel release

on:
  workflow_dispatch:
    inputs:
      stage_to_cpanel:
        description: 'Stage the verified build in cPanel releases/ (does not change public_html)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build verified release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:prepare
      - name: Pack static release
        run: tar -C dist -czf "$RUNNER_TEMP/dentvitalis-${GITHUB_SHA}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: dentvitalis-${{ github.sha }}
          path: ${{ runner.temp }}/dentvitalis-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dentvitalis-private-backend-patches-${{ github.sha }}
          path: server/application/view/template/
          if-no-files-found: error
          retention-days: 14

  stage:
    name: Stage release outside public_html
    needs: build
    if: ${{ inputs.stage_to_cpanel }}
    runs-on: ubuntu-latest
    environment: cpanel-staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dentvitalis-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify and upload release
        env:
          DEPLOY_KEY: ${{ secrets.CPANEL_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.CPANEL_SSH_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          DEPLOY_ROOT: ${{ vars.CPANEL_DEPLOY_ROOT }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_ROOT"
          case "$DEPLOY_ROOT" in /*) ;; *) echo 'CPANEL_DEPLOY_ROOT must be absolute' >&2; exit 1;; esac
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          archive="$RUNNER_TEMP/release/dentvitalis-${GITHUB_SHA}.tar.gz"
          archive_name=".incoming-${GITHUB_SHA}.tar.gz"
          checksum_name="${archive_name}.sha256"
          checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$checksum" "$archive_name" > "$RUNNER_TEMP/$checksum_name"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "$target" "mkdir -p '$DEPLOY_ROOT/releases' '$DEPLOY_ROOT/backups'"
          scp "$archive" "$target:$DEPLOY_ROOT/releases/$archive_name"
          scp "$RUNNER_TEMP/$checksum_name" "$target:$DEPLOY_ROOT/releases/$checksum_name"
          ssh "$target" "set -eu
            cd '$DEPLOY_ROOT/releases'
            sha256sum -c '$checksum_name'
            test ! -e '$GITHUB_SHA'
            mkdir '$GITHUB_SHA'
            tar -xzf '$archive_name' -C '$GITHUB_SHA'
            test -f '$GITHUB_SHA/index.html'
            test -f '$GITHUB_SHA/release-manifest.json'
            rm '$archive_name' '$checksum_name'"
          echo "Staged release: $DEPLOY_ROOT/releases/$GITHUB_SHA"
